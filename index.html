<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Lead Management - Mini CRM</title><link rel="stylesheet" href="style.css"></head><body>
<section id="loginView" class="auth-page"><div class="auth-card"><h1>Client Lead Management</h1><p>Admin Login</p><form id="loginForm"><label>Email</label><input id="loginEmail" type="email" value="admin@example.com" required><label>Password</label><input id="loginPassword" type="password" value="Admin@123" required><button class="primary-btn">Login</button><p id="loginMessage" class="message"></p></form></div></section>
<section id="appView" class="hidden"><header class="topbar"><div><h1>Client Lead Management</h1><p>Mini CRM Dashboard</p></div><button id="logoutBtn" class="logout-btn">Logout</button></header><main class="container"><section class="stats"><div class="stat-card"><span>Total Leads</span><strong id="totalCount">0</strong></div><div class="stat-card"><span>New</span><strong id="newCount">0</strong></div><div class="stat-card"><span>Contacted</span><strong id="contactedCount">0</strong></div><div class="stat-card"><span>Converted</span><strong id="convertedCount">0</strong></div></section><section class="toolbar"><input id="searchInput" type="search" placeholder="Search by name, email or phone..."><select id="statusFilter"><option value="">All Statuses</option><option>New</option><option>Contacted</option><option>Converted</option></select><button id="addLeadBtn" class="primary-btn">+ Add Lead</button></section><section class="table-card"><div id="loading" class="empty">Loading leads...</div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Source</th><th>Status</th><th>Follow-up</th><th>Actions</th></tr></thead><tbody id="leadTableBody"></tbody></table></div><div id="emptyState" class="empty hidden">No leads found.</div></section></main></section>
<div id="leadModal" class="modal hidden"><div class="modal-card"><div class="modal-header"><h2 id="modalTitle">Add Lead</h2><button id="closeModalBtn" class="icon-btn">&times;</button></div><form id="leadForm"><input id="leadId" type="hidden"><label>Name *</label><input id="leadName" required><label>Email *</label><input id="leadEmail" type="email" required><label>Phone</label><input id="leadPhone" type="tel"><label>Source</label><select id="leadSource"><option>Website</option><option>Instagram</option><option>Facebook</option><option>Referral</option><option>Other</option></select><label>Status</label><select id="leadStatus"><option>New</option><option>Contacted</option><option>Converted</option></select><label>Follow-up Date</label><input id="leadFollowUp" type="date"><label>Notes</label><textarea id="leadNotes" rows="4"></textarea><div class="form-actions"><button type="button" id="cancelBtn" class="secondary-btn">Cancel</button><button class="primary-btn">Save Lead</button></div><p id="formMessage" class="message"></p></form></div></div><script src="script.js"></script></body></html>
